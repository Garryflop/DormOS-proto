name: Buf Generate and Push

on:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DormOS-proto
        uses: actions/checkout@v4

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1.31.0
        with:
          github_token: ${{ github.token }}

      - name: Lint Protos
        uses: bufbuild/buf-lint-action@v1

      - name: Checkout DormOS-gen-go
        uses: actions/checkout@v4
        with:
          repository: Garryflop/DormOS-gen-go
          token: ${{ secrets.PAT_TOKEN }}
          path: DormOS-gen-go

      - name: Generate Go Code
        run: |
          buf generate
          # Copy generated files to the target repo
          cp -r gen/go/* DormOS-gen-go/
          
      - name: Commit and Push to DormOS-gen-go
        run: |
          cd DormOS-gen-go
          
          # Initialize or update go module
          if [ ! -f go.mod ]; then
            go mod init github.com/Garryflop/DormOS-gen-go
          fi
          go mod edit -go=1.25.5
          go mod tidy
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate Go code from protos and add go.mod [skip ci]"
            git push origin main
          fi
